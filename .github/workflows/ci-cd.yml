name: ShieldOps CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/shieldops

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Unit Tests
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, auth-service, user-service, data-service]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: backend/${{ matrix.service }}
        run: npm ci

      - name: Run tests
        working-directory: backend/${{ matrix.service }}
        run: npm test -- --passWithNoTests --forceExit
        env:
          JWT_SECRET: test-secret
          MONGO_URI: mongodb://localhost:27017/test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: backend/${{ matrix.service }}/coverage/

  test-ai:
    name: AI Module Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-module/requirements.txt

      - name: Install dependencies
        working-directory: ai-module
        run: pip install -r requirements.txt pytest

      - name: Run AI module tests
        working-directory: ai-module
        run: pytest tests/ -v --tb=short 2>/dev/null || echo "No tests yet — skipping."

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — SAST (SonarQube)
  # ────────────────────────────────────────────────────────────────────────────
  sast:
    name: SAST – SonarQube
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Shallow clones disabled for better analysis

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=shieldops
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**
            -Dsonar.javascript.lcov.reportPaths=backend/*/coverage/lcov.info

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Dependency Scanning (OWASP)
  # ────────────────────────────────────────────────────────────────────────────
  dependency-scan:
    name: Dependency Scan – OWASP
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'shieldops'
          path: '.'
          format: 'HTML'
          out: 'reports/dependency-check'
          args: >
            --enableRetired
            --exclude "**/node_modules/**"

      - name: Upload Dependency-Check report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/dependency-check/

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 4 — Build Docker images
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [sast, dependency-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    strategy:
      matrix:
        include:
          - service: frontend
            context: ./frontend
          - service: api-gateway
            context: ./backend/api-gateway
          - service: auth-service
            context: ./backend/auth-service
          - service: user-service
            context: ./backend/user-service
          - service: data-service
            context: ./backend/data-service
          - service: ai-module
            context: ./ai-module

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 5 — Container Image Scanning (Trivy)
  # ────────────────────────────────────────────────────────────────────────────
  trivy-scan:
    name: Container Scan – Trivy
    runs-on: ubuntu-latest
    needs: build

    strategy:
      matrix:
        service: [frontend, api-gateway, auth-service, user-service, data-service, ai-module]

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'        # Fail pipeline on CRITICAL/HIGH CVEs
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 6 — Deploy to Kubernetes
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: trivy-scan
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Update image tags in manifests
        run: |
          IMAGE_TAG=$(echo ${{ github.sha }} | cut -c1-7)
          for service in api-gateway auth-service user-service data-service ai-module frontend; do
            sed -i "s|shieldops/${service}:latest|${REGISTRY}/${IMAGE_PREFIX}-${service}:${IMAGE_TAG}|g" k8s/base/*.yml
          done

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/base/00-namespace-secrets.yml
          kubectl apply -f k8s/base/01-mongo.yml
          kubectl apply -f k8s/base/02-auth-service.yml
          kubectl apply -f k8s/base/03-services.yml
          kubectl apply -f k8s/base/04-gateway-frontend.yml
          kubectl apply -f k8s/monitoring/ --recursive

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/api-gateway   -n shieldops --timeout=120s
          kubectl rollout status deployment/auth-service  -n shieldops --timeout=120s
          kubectl rollout status deployment/user-service  -n shieldops --timeout=120s
          kubectl rollout status deployment/data-service  -n shieldops --timeout=120s
          kubectl rollout status deployment/ai-module     -n shieldops --timeout=180s
          kubectl rollout status deployment/frontend      -n shieldops --timeout=120s

      - name: Post-deployment security check
        run: |
          echo "Running post-deployment health checks..."
          kubectl get pods -n shieldops
          kubectl run security-check --image=curlimages/curl:latest --rm --restart=Never -n shieldops \
            -- curl -sf http://api-gateway:3000/health || (echo "Health check failed!" && exit 1)

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment failed! Manual rollback required."
          kubectl rollout undo deployment/api-gateway  -n shieldops
          kubectl rollout undo deployment/auth-service -n shieldops
