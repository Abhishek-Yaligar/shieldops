global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'shieldops'

rule_files:
  - 'alert_rules.yml'

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:3000']
    metrics_path: '/metrics'

  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:3001']
    metrics_path: '/metrics'

  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:3002']
    metrics_path: '/metrics'

  - job_name: 'data-service'
    static_configs:
      - targets: ['data-service:3003']
    metrics_path: '/metrics'

  - job_name: 'ai-module'
    static_configs:
      - targets: ['ai-module:5000']
    metrics_path: '/metrics'

  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongo:27017']
